name: Validar AulaReserva

description: Comprueba que existen las rutas del proyecto

inputs:
  rutas:
    description: Rutas que queremos comprobar, separadas por espacios
    required: true

outputs:
  total:
    description: Número de rutas verificadas
    value: ${{ steps.validar.outputs.total }}

runs:
  using: composite
  steps:
    - id: validar
      shell: bash
      env:
        RUTAS: ${{ inputs.rutas }}
      run: |
        total=0

        for ruta in $RUTAS; do
          if [ -e "$ruta" ]; then
            echo "Ruta encontrada: $ruta"
            total=$((total + 1))
          else
            echo "Error: No existe la ruta $ruta"
            exit 1
          fi
        done

        echo "total=$total" >> "$GITHUB_OUTPUT"
        echo "Se han verificado $total rutas"
